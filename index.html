         padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

<body>
<div id="app">
  <header><h1>Jam <b>Room</b></h1><span id="song"></span><span id="left"></span></header>
  <canvas id="stage"></canvas>
  <div id="hint"></div>

</div>
<div id="over" hidden><div class="card">
  <h2 id="title"></h2><div class="sub" id="sub"></div><ol id="results"></ol>
  <h3>Most cheered</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Next song</button><p id="next"></p>

<script>
/* ═══ JAM ROOM · a Multiplayer Agent starter ══════════════════════════════════════════
 * Make music together. One 16-step loop, four instruments: drums, bass, chords and lead.
 * You play one of them: tap squares to add notes, and everyone hears the same loop in sync.
 * Party, 1–8 players; bots noodle on the instruments nobody is playing.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ song length, tempo range, bots, and the four INSTRUMENTS
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MUSIC ......... a song from its seed: key, chords, which note each row plays
 *   BAND (HOST) ... the phases (count, jam, done), who plays what, applying everyone's notes
 *                   and cheers, the bots. Only the host writes these.
 *   MY JAM ........ toggling notes on your instrument, switching instrument, cheering
 *   SOUND ......... WebAudio synths, and the scheduler that plays the loop on the shared clock
 *   DRAW .......... the lanes, the playhead, notes lighting up, hearts
 *   HUD & RESULTS . header, hint line, the song's round-up card, leaderboard
 *   INPUT ......... tap or click squares; tap another instrument to play it; ♥ to cheer
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The song lives in ONE shared field, `song`: {id, v, phase, seed, bpm, t0, endsAt, res}.
 *     Only the HOST writes it; `v` goes up on every write. t0 is a timestamp: step k of the
 *     loop plays at t0 + k × step length on every screen, so everyone hears the same beat.
 *     The key, the chords and the starting grooves come from mulberry32(seed).
 *   - The band lives in ONE shared field, `band`: {r, v, p, s, h, n}: the four patterns
 *     (16 letters each, one per step, a letter = which of the 5 rows are on), who sits at
 *     each instrument, and everyone's cheers (h) and notes placed (n). Only the host writes it.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It seats new players, runs the clock, plays the bots on empty
 *     instruments, and applies the intents. A new host adopts song and band from state.
 *   - Everyone else sends intents: "toggle" {i, s, r, on} (a note on your instrument),
 *     "clear" {i} (wipe your instrument), "seat" {i} (play another instrument) and "cheer" {i}. Your note shows at once until
 *     the band comes back.
 *   - Each player writes its OWN entity: `hb` (heartbeat) once a second, `rdy` (Next song)
 *     and `n`/`c` (name, color).
 *   - Live ops: mp.live.config.bpm (a fixed tempo) and .songSecs change the next song.
 *   - ?attract plays offline: bots plus an autopilot on your instrument (the preview video).
 *   - Leaderboard "cheers": the most cheers each player got in one song.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  songSecs: 150,          // how long a song lasts before the round-up (live ops: config.songSecs)
  bpm: [92, 124],         // each song picks a tempo in this range (live ops: config.bpm sets one)
  countBeats: 4,          // count-in beats before a song starts
  resultsMs: 12000,       // ms on the round-up card before the next song
  perSeat: 2,             // players who can share one instrument
  botEveryMs: [2200, 4800], // a bot's pause between changes to its pattern
  botCheerMs: [6000, 14000],// how often a bot cheers someone
  cheerGapMs: 500,        // fastest you can cheer
  flushMs: 90,            // the host writes the band at most this often
  aheadMs: 160,           // sound is queued this far ahead of the beat
  volume: 0.5,
  board: "cheers",        // leaderboard: most cheers in one song
};
// The four instruments. Rows are listed top to bottom; min/max = how busy a bot keeps it.
const INSTRUMENTS = [
  { name: "Drums", color: "#ff5c8a", bot: "Boom Bot", rows: ["Hat", "Clap", "Snare", "Tom", "Kick"], min: 9, max: 17 },
  { name: "Bass", color: "#3dd6ff", bot: "Low Rider", rows: ["8va", "5th", "3rd", "Root", "Low"], min: 4, max: 9, mono: true },
  { name: "Chords", color: "#b07cff", bot: "Padsworth", rows: ["Top", "High", "5th", "3rd", "Root"], min: 4, max: 13 },
  { name: "Lead", color: "#ffd23f", bot: "Synthia", rows: ["", "", "", "", ""], min: 4, max: 10, mono: true },
];
const COLORS = ["#ff6fb5", "#3fa7ff", "#ffb347", "#4ee08a", "#c77dff", "#3fe0c5", "#ff6b6b", "#e6e65c"];
const NAME_A = ["Funky", "Groovy", "Cosmic", "Smooth", "Jazzy", "Electric"], NAME_B = ["Beat", "Keys", "Bass", "Vibes", "Drummer", "Synth"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'jam-room',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} }, netDown = false;
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const liveConfig = () => (net && net.live && net.live.config) || {};
const nameOf = (id) => (id === net.sessionId ? myName : String((S.entities.players[id] || {}).n || "Player"));
const colorOf = (id) => (id === net.sessionId ? myColor : (S.entities.players[id] || {}).c || "#ccc");

// ── MUSIC ───────────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// Chords as notes above the key's root. Each song loops a 4-chord progression, one chord per bar.
const MINOR = { prog: [[0, 8, 3, 10], [0, 5, 8, 7], [0, 10, 8, 10], [0, 3, 10, 5], [0, 8, 5, 7]], chord: { 0: [0, 3, 7], 3: [3, 7, 10], 5: [5, 8, 12], 7: [7, 11, 14], 8: [8, 12, 15], 10: [10, 14, 17] }, lead: [15, 12, 10, 7, 3] };
const MAJOR = { prog: [[0, 7, 9, 5], [0, 5, 7, 5], [0, 9, 5, 7], [0, 4, 5, 7], [0, 5, 9, 7]], chord: { 0: [0, 4, 7], 2: [2, 5, 9], 4: [4, 7, 11], 5: [5, 9, 12], 7: [7, 11, 14], 9: [9, 12, 16] }, lead: [16, 12, 9, 7, 4] };
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const songMemo = new Map();
/** Everything about a song that comes from its seed: name, key, chords, step length. */
function songOf(s) {
  const key = s.seed + ":" + s.bpm;
  if (songMemo.has(key)) return songMemo.get(key);
  const rnd = mulberry32(s.seed), pick = (a) => a[Math.floor(rnd() * a.length)];
  const minor = rnd() < 0.6, scale = minor ? MINOR : MAJOR, root = 40 + Math.floor(rnd() * 8); // root: a bass note, E2 to B2
  const name = pick(["Neon", "Midnight", "Velvet", "Cosmic", "Sunset", "Turbo", "Crystal", "Lazy", "Golden", "Rainy"]) + " " + pick(["Groove", "Pulse", "Drift", "Echo", "Fever", "Waves", "Strut", "Bounce", "Dreams", "Shuffle"]);
  const song = { name, root, minor, prog: pick(scale.prog), scale, bpm: s.bpm, stepMs: 60000 / s.bpm / 4, keyName: NOTE_NAMES[root % 12] + (minor ? " minor" : " major") };
  songMemo.set(key, song);
  return song;
}
/** The MIDI note a row plays in a given bar (bass and chords follow the bar's chord, lead the key). */
function noteFor(i, row, song, bar) {
  const t = song.scale.chord[song.prog[bar % 4]], R = song.root;
  if (i === 1) return R + [t[0] + 12, t[2], t[1], t[0], t[2] - 12][row];
  if (i === 2) return R + 12 + [t[1] + 12, t[0] + 12, t[2], t[1], t[0]][row];
  return R + 24 + song.scale.lead[row];
}
// Patterns: 16 letters, one per step; the letter's place in ALPH is a 5-bit mask of the rows that are on.
const ALPH = "abcdefghijklmnopqrstuvwxyzABCDEF", EMPTY = "a".repeat(16);
const cleanPat = (p) => (typeof p === "string" && p.length === 16 && /^[a-zA-F]+$/.test(p) ? p : EMPTY);
const bitsOf = (p, step) => Math.max(0, ALPH.indexOf(p[step]));
const withBits = (p, step, bits) => p.slice(0, step) + ALPH[bits] + p.slice(step + 1);
const countNotes = (p) => [...p].reduce((n, ch) => { let b = ALPH.indexOf(ch); for (; b; b >>= 1) n += b & 1; return n; }, 0);
/** The grooves a song starts with, from its seed, so the room sounds good from the first beat. */
function starterPatterns(seed) {
  const rnd = mulberry32(seed ^ 0x51ed), pick = (a) => a[Math.floor(rnd() * a.length)], P = [0, 1, 2, 3].map(() => Array(16).fill(0));
  for (let st = 0; st < 16; st += 2) P[0][st] |= 1;            // hats on the 8ths
  for (const st of [0, 8, pick([6, 10, 11, 14])]) P[0][st] |= 16; // kicks
  for (const st of [4, 12]) P[0][st] |= 4;                     // snares
  P[1][0] = 8; P[1][pick([6, 7])] = pick([2, 8]); P[1][10] = pick([1, 8]); if (rnd() < 0.6) P[1][14] = 2;
  P[2][0] = 28; P[2][pick([6, 10])] = pick([28, 14]);
  let row = pick([1, 2, 3]);
  for (const st of [2, pick([5, 6]), 9, pick([12, 13])]) { P[3][st] = 1 << row; row = Math.max(0, Math.min(4, row + pick([-1, 1, 1, -2]))); }
  return P.map((steps) => steps.map((b) => ALPH[b]).join(""));
}

// ── BAND (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, band: null, wasHost: false, dirty: false, lastFlush: 0, botNext: [0, 0, 0, 0], botCheerAt: 0, cheers: [], lastCheer: new Map() };
/** The song as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function song() {
  const s = cached("song", S.shared.song, null);
  return host.last && isHost() && (!s || host.last.v > s.v) ? host.last : s;
}
function writeSong(s) { s = { ...s, v: (song()?.v ?? 0) + 1 }; host.last = s; net.setShared("song", JSON.stringify(s)); return s; }
/** The band: the host's own live copy, everyone else's from state. */
function band() { return isHost() && host.band ? host.band : cached("band", S.shared.band, null); }
function newSong(id) {
  const lc = liveConfig(), [lo, hi] = CONFIG.bpm;
  const bpm = Math.max(60, Math.min(180, Math.round(+lc.bpm || lo + Math.round((Math.random() * (hi - lo)) / 4) * 4)));
  const secs = Math.max(30, Math.min(900, +lc.songSecs || CONFIG.songSecs)), bar = 16 * (60000 / bpm / 4);
  const t0 = Date.now() + CONFIG.countBeats * (60000 / bpm) + 400;
  return { id, phase: "count", seed: (Math.random() * 1e9) | 0, bpm, t0, endsAt: t0 + Math.max(4, Math.round((secs * 1000) / bar)) * bar, res: [] };
}
/** A fresh band for a song: its starter grooves, and the players keep their instruments. */
function freshBand(s, prev) {
  return { r: s.id, v: (prev?.v ?? 0) + 1, p: starterPatterns(s.seed), s: prev && Array.isArray(prev.s) ? prev.s.map((ids) => [...ids]) : [[], [], [], []], h: {}, n: {} };
}
/** Become host: take over the band exactly as state has it. */
function adopt() {
  host.wasHost = true; host.cheers = [];
  const s = song(), b = parse(S.shared.band, null);
  host.band = s && b && b.r === s.id && Array.isArray(b.p) && Array.isArray(b.s) ? { ...b, p: b.p.map(cleanPat), s: b.s.map((x) => (Array.isArray(x) ? x : [])), h: b.h || {}, n: b.n || {} } : null;
}
const seatOf = (b, id) => (b ? b.s.findIndex((ids) => ids.includes(id)) : -1);
/** Seat every live player (an empty instrument first, then one with room), and free the seats of those who left. */
function seatPlayers() {
  const b = host.band, live = livePlayers();
  for (let i = 0; i < 4; i++) { const kept = b.s[i].filter((id) => live.includes(id)); if (kept.length !== b.s[i].length) { b.s[i] = kept; host.dirty = true; } }
  for (const id of live) {
    if (seatOf(b, id) >= 0) continue;
    let i = b.s.findIndex((ids) => !ids.length);
    if (i < 0) { const n = Math.min(...b.s.map((x) => x.length)); i = n < CONFIG.perSeat ? b.s.findIndex((x) => x.length === n) : -1; }
    if (i >= 0) { b.s[i].push(id); host.dirty = true; }
  }
}
/** A "toggle" intent: the sender plays instrument i, so it may set that step's row on or off. */
function applyToggle(from, m) {
  const b = host.band, { i, s, r } = m || {};
  if (!b || ![i, s, r].every(Number.isInteger) || i < 0 || i > 3 || s < 0 || s > 15 || r < 0 || r > 4 || !b.s[i].includes(from)) return;
  setNote(i, s, r, !!m.on, from);
  if (m.on && Math.random() < 0.15) host.cheers.push({ i, at: performance.now() + 900 + Math.random() * 2000 }); // a bot likes it
}
function setNote(i, step, row, on, who) {
  const b = host.band, bits = bitsOf(b.p[i], step);
  const want = on ? (INSTRUMENTS[i].mono ? 1 << row : bits | (1 << row)) : bits & ~(1 << row);
  if (want === bits) return;
  b.p[i] = withBits(b.p[i], step, want);
  if (on) b.n[who] = (b.n[who] || 0) + 1;
  host.dirty = true;
}
/** A "clear" intent: wipe instrument i (one message, however many notes it had). */
function applyClear(from, m) {
  const b = host.band, i = m && m.i;
  if (!b || !Number.isInteger(i) || i < 0 || i > 3 || !b.s[i].includes(from) || b.p[i] === EMPTY) return;
  b.p[i] = EMPTY; host.dirty = true;
}
/** A "seat" intent: move to instrument i if it has room. */
function applySeat(from, m) {
  const b = host.band, i = m && m.i;
  if (!b || !Number.isInteger(i) || i < 0 || i > 3 || b.s[i].includes(from) || b.s[i].length >= CONFIG.perSeat || !livePlayers().includes(from)) return;
  for (const ids of b.s) { const k = ids.indexOf(from); if (k >= 0) ids.splice(k, 1); }
  b.s[i].push(from); host.dirty = true;
}
/** A "cheer" intent: a heart for everyone playing instrument i (a bot if nobody is). */
function applyCheer(from, m) {
  const b = host.band, i = m && m.i, now = performance.now();
  if (!b || !Number.isInteger(i) || i < 0 || i > 3 || b.s[i].includes(from) || now - (host.lastCheer.get(from) || -1e9) < CONFIG.cheerGapMs - 150) return;
  host.lastCheer.set(from, now);
  for (const id of b.s[i].length ? b.s[i] : ["bot" + i]) b.h[id] = (b.h[id] || 0) + 1;
  host.dirty = true;
}
// Bots: on every instrument nobody plays, a gentle change every few seconds that keeps the groove musical.
const W = (pairs) => { const total = pairs.reduce((s, p) => s + p[1], 0); let r = Math.random() * total; for (const [v, w] of pairs) if ((r -= w) <= 0) return v; return pairs[0][0]; };
/** A note that suits instrument i: [step, row]. */
function suggest(i, p) {
  if (i === 0) {
    const row = W([[0, 3], [1, 1], [2, 1.2], [3, 1], [4, 2]]);
    const steps = [[1, 3, 5, 7, 9, 11, 13, 15, 0, 4, 8, 12], [4, 12, 14, 15], [4, 12, 7, 15, 10], [12, 13, 14, 15, 6], [0, 8, 3, 6, 10, 11, 14]][row];
    return [steps[Math.floor(Math.random() * steps.length)], row];
  }
  if (i === 1) return [W([[0, 3], [3, 2], [6, 2], [8, 2], [10, 2], [11, 1], [14, 2], [2, 1], [12, 1]]), W([[0, 1], [1, 1.5], [2, 1], [3, 3], [4, 1]])];
  if (i === 2) return [W([[0, 3], [4, 1], [6, 2], [8, 2], [10, 2], [12, 1], [14, 1], [3, 1], [11, 1]]), W([[2, 2], [3, 2], [4, 3], [1, 1.5], [0, 1]])];
  const step = Math.floor(Math.random() * 16); // lead: near the note before it
  let prev = 2;
  for (let k = 1; k < 16; k++) { const bits = bitsOf(p, (step - k + 16) % 16); if (bits) { prev = Math.round(Math.log2(bits & -bits)); break; } }
  return [step, Math.max(0, Math.min(4, prev + W([[-2, 1], [-1, 3], [1, 3], [2, 1], [0, 0.5]])))];
}

        const hit = here ? 1 - frac : 0, grow = hit * (L.big ? 3 : 1.5);
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = here ? 18 : 0;
        rr(x + inset - grow, y + inset - grow, w - inset * 2 + grow * 2, h - inset * 2 + grow * 2, L.big ? 8 : 3); ctx.fill(); ctx.shadowBlur = 0;
        if (here) { ctx.fillStyle = `rgba(255,255,255,${0.55 * hit})`; ctx.fill(); }
      } else {
        ctx.fillStyle = here ? "#ffffff2a" : Math.floor(st / 4) % 2 ? "#ffffff0b" : "#ffffff14";
        rr(x + inset, y + inset, w - inset * 2, h - inset * 2, L.big ? 8 : 3); ctx.fill();
      }
      if (L.big && st === 0 && L.gx > 0 && Math.floor(st / L.cols) === 0) { ctx.font = "700 11px system-ui, sans-serif"; ctx.fillStyle = "#a59fc9"; ctx.textAlign = "right"; ctx.fillText(inst.rows[r] || rowName(L.i, r), L.gx - 8, y + h / 2); ctx.textAlign = "left"; }
    }
  }
  // the playhead: a bright band sweeping across the steps
  if (step >= 0) {
    const [x, y, w] = cellRect(L, step, 0), h = 5 * L.ch, px = x + frac * w;
    ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fillRect(x, y, w, h);
    const g = ctx.createLinearGradient(px - 14, 0, px, 0); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(255,255,255,0.35)");
    ctx.fillStyle = g; ctx.fillRect(px - 14, y, 14, h); ctx.fillStyle = "#ffffffcc"; ctx.fillRect(px - 1, y, 2, h);
  }
  // the pops of notes other people (and bots) just changed
  for (const p of pops) {
    if (p.i !== L.i) continue;
    const age = (now - p.at) / 1000; if (age > 0.6) continue;
    const [x, y, w, h] = cellRect(L, p.st, p.r);
    ctx.strokeStyle = p.on ? "#ffffff" : col; ctx.globalAlpha = 1 - age / 0.6; ctx.lineWidth = 2;
    rr(x - age * 10, y - age * 10, w + age * 20, h + age * 20, 8); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
const rowName = (i, r) => (i === 3 ? ["High", "", "", "", "Low"][r] : "");
function fitText(text, w) { if (ctx.measureText(text).width <= w) return text; while (text.length > 2 && ctx.measureText(text + "…").width > w) text = text.slice(0, -1); return text + "…"; }
function drawHeart(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.fill();
}
function floatHeart(i, mine) { hearts.push({ i, at: performance.now(), seed: Math.random() * 6, mine }); }
/** Compare the band with the last one seen: changed notes pop, new cheers float up hearts. */
const seenBand = { r: -1, p: [], h: {} };
function diffBand(b) {
  if (!b) return;
  if (seenBand.r !== b.r) { seenBand.r = b.r; seenBand.p = b.p.map(cleanPat); seenBand.h = { ...b.h }; return; }
  const now = performance.now();
  b.p.forEach((raw, i) => {
    const p = cleanPat(raw), old = seenBand.p[i];
    if (p !== old) for (let st = 0; st < 16; st++) { const x = bitsOf(p, st), y = bitsOf(old, st); if (x !== y) for (let r = 0; r < 5; r++) if (((x ^ y) >> r) & 1 && !pending.has(i + ":" + st)) pops.push({ i, st, r, on: (x >> r) & 1, at: now }); }
    seenBand.p[i] = p;
  });
  for (const [id, n] of Object.entries(b.h || {})) {
    const before = seenBand.h[id] || 0;
    if (n > before) { const i = id.startsWith("bot") ? +id.slice(3) : seatOf(b, id); if (i >= 0) for (let k = 0; k < Math.min(3, n - before); k++) floatHeart(i, false); if (id === net.sessionId) sfx("cheer"); }
  }
  seenBand.h = { ...b.h };
  while (pops.length > 60) pops.shift();
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
let board = null, boardFor = -1, hintFlash = null;
function flashHint(text) { hintFlash = { text, at: performance.now() }; }
function hud(s, b) {
  const t = Date.now(), sg = songOf(s), mine = b ? seatOf(b, net.sessionId) : -1;
  $("song").textContent = `♪ ${sg.name} · ${sg.bpm} BPM` + (CW > 560 ? ` · ${sg.keyName}` : "");
  $("left").textContent = s.phase === "jam" ? clock(s.endsAt - t) : s.phase === "count" ? clock(s.endsAt - s.t0) : "0:00";
  if (mine !== me.seat) { me.seat = mine; me.seatAt = performance.now(); }
  let hint = "";
  if (!ATTRACT) {
    const since = performance.now() - me.seatAt;
    if (hintFlash && performance.now() - hintFlash.at < 1800) hint = hintFlash.text;
    else if (!audio) hint = touchUI ? "Tap anywhere to turn the sound on" : "Click anywhere to turn the sound on";
    else if (mine >= 0 && since < 12000) hint = `You're on ${INSTRUMENTS[mine].name}: tap squares to add notes. Tap another instrument to switch.`;
    else if (mine < 0 && b) hint = "Every instrument is taken: cheer the band with ♥";
  }
  $("hint").textContent = hint;
  if (ATTRACT) { $("net").textContent = ""; $("over").hidden = true; return; }
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the band" : ""}`;
  $("over").hidden = s.phase !== "done";
  if (s.phase === "done") {
    if (boardFor !== s.id) { boardFor = s.id; showResults(s, b); }
    $("again").textContent = me.ready === s.id ? "Waiting for the others…" : "Next song";
    $("next").textContent = `Next song in ${Math.max(0, Math.ceil((s.endsAt - t) / 1000))}s`;
  }
}
function showResults(s, b) {
  const sg = songOf(s), res = s.res || [], top = res[0];
  $("title").textContent = `“${sg.name}”`;
  $("sub").textContent = top && top[5] ? `Crowd favorite: ${top[0] === net.sessionId ? "you" : top[1]}, ${top[5]} ♥` : `${sg.bpm} BPM · ${sg.keyName}`;
  $("results").innerHTML = res.map(([id, name, color, i, notes, h]) => `<li class="${id === net.sessionId ? "me" : ""}"><b style="color:${esc(color)}">●</b> ${esc(id === net.sessionId ? "You" : name)}<span>♥ ${h}</span><small>${INSTRUMENTS[i] ? INSTRUMENTS[i].name : ""} · ${notes} note${notes === 1 ? "" : "s"} added</small></li>`).join("");
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class=\"note\">Loading…</li>";
  const row = res.find((x) => x[0] === net.sessionId), score = row && me.submitted !== s.id ? row[5] : 0;
  me.submitted = s.id;
  (score ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>♥ ${Number(e.score)}</span></li>`).join("") : "<li class=\"note\">No cheers yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const s = song(); if (s && s.phase === "done") { me.ready = s.id; net.me.set("rdy", s.id); $("again").textContent = "Waiting for the others…"; } }
$("again").onclick = playAgain;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
/** A tap on the stage: a button (switch, cheer, clear), or a square on your instrument. */
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (const btn of buttons) if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) { btn.fn(); return; }
  const L = lanes.find((l) => l.big);
  if (!L) return;
  for (let st = 0; st < 16; st++) for (let row = 0; row < 5; row++) {
    const [cx, cy, w, h] = cellRect(L, st, row);
    if (x >= cx && x < cx + w && y >= cy && y < cy + h) { toggle(st, row); paint = { on: (viewBits(band(), L.i, st) >> row) & 1, done: new Set([st + ":" + row]) }; try { cv.setPointerCapture(e.pointerId); } catch {} return; }
  }
});
// Drag across squares to paint (or erase) a run of notes, like the first one you touched.
let paint = null;
cv.addEventListener("pointermove", (e) => {
  if (!paint || !(e.buttons & 1) && e.pointerType === "mouse") return;
  const L = lanes.find((l) => l.big), b = band(); if (!L || !b) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (let st = 0; st < 16; st++) for (let row = 0; row < 5; row++) {
    const [cx, cy, w, h] = cellRect(L, st, row);
    if (x >= cx && x < cx + w && y >= cy && y < cy + h && !paint.done.has(st + ":" + row)) { paint.done.add(st + ":" + row); if (((viewBits(b, L.i, st) >> row) & 1) !== paint.on) toggle(st, row); }
  }
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, () => (paint = null));
addEventListener("keydown", (e) => { unlockAudio(); if ((e.key === "Enter" || e.key === " ") && song()?.phase === "done") { e.preventDefault(); playAgain(); } });
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("touchmove", (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-click on the grid doesn't open the browser menu

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, lastPhase = "";
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the band meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.wasHost = false;
  const s = song(), b = band();
  if (s) {
    if (me.songId !== s.id) { me.songId = s.id; pending.clear(); pops.length = 0; $("over").hidden = true; }
    if (lastPhase !== s.phase) { if (s.phase === "done" && lastPhase === "jam") sfx("end"); lastPhase = s.phase; }
    diffBand(b);
    if (s.phase === "jam") autopilot(now);
    scheduleMusic(s, b);
    draw(s, b, now, dt);
    if (now - lastHud > 100) { lastHud = now; hud(s, b); }
  } else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, CW, CH); }
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = INSTRUMENTS.map((x) => x.color);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

(async function start() {
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("toggle", (m, from) => { if (isHost()) applyToggle(from, m); });
  net.on("clear", (m, from) => { if (isHost()) applyClear(from, m); });
  net.on("seat", (m, from) => { if (isHost()) applySeat(from, m); });
  net.on("cheer", (m, from) => { if (isHost()) applyCheer(from, m); });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countBeats: 1, botEveryMs: [500, 1100], resultsMs: 1500 });
  requestAnimationFrame(frame);
})();
</script>
